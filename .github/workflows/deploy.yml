name: CI/CD

# PR: só testes. Push na main: testes -> imagem no ECR -> deploy na EC2.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Dois pushes seguidos não fazem dois deploys ao mesmo tempo; o segundo espera o primeiro.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'deploy-prod' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Os @FuzzTest rodam só o corpus salvo, como regressão. Fuzz de verdade é local.
      - name: auth-core (testes + install no ~/.m2)
        run: mvn -B -f auth-core/pom.xml install

      - name: booklit-server
        run: mvn -B verify

  imagem:
    needs: testes
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      imagem: ${{ steps.tag.outputs.imagem }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      # QEMU só emula o estágio final (arm64); o Maven roda nativo, ver o Dockerfile.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - id: tag
        run: echo "imagem=${{ vars.ECR_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ vars.DOCKER_PLATFORM || 'linux/arm64' }}
          push: true
          tags: |
            ${{ steps.tag.outputs.imagem }}
            ${{ vars.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: imagem
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: deploy.sh na EC2 via SSM
        env:
          INSTANCIA: ${{ vars.EC2_INSTANCE_ID }}
          IMAGEM: ${{ needs.imagem.outputs.imagem }}
        run: |
          set -euo pipefail
          COMANDO=$(aws ssm send-command \
            --instance-ids "$INSTANCIA" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters "{\"commands\":[\"/opt/booklit/deploy.sh $IMAGEM\"],\"executionTimeout\":[\"600\"]}" \
            --query Command.CommandId --output text)
          echo "Comando SSM: $COMANDO"

          # deploy.sh espera até 5 min pela API; aqui damos 10.
          for _ in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMANDO" --instance-id "$INSTANCIA" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Pending|InProgress|Delayed) sleep 5 ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation --command-id "$COMANDO" --instance-id "$INSTANCIA" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Status: $STATUS"
          test "$STATUS" = "Success"