server:
  # A Railway injeta PORT e espera que a aplicacao escute nela.
  port: ${PORT:8080}
  # Atrás do Caddy: o Tomcat lê o X-Forwarded-For de proxies da rede interna (o Caddy está na
  # rede do Docker), e request.getRemoteAddr() passa a ser o IP de quem chamou, não o do Caddy.
  # É ele que o limite de tentativas de login usa.
  forward-headers-strategy: native

spring:
  application:
    name: clube-livro

  datasource:
    url: ${JDBC_DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      # O schema é do Flyway (db/migration); o Hibernate só confere se as entidades batem.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    locations: classpath:db/migration
    # Banco que já existia antes do Flyway (produção, criado pelo ddl-auto): na primeira subida
    # o Flyway marca a V1 (schema inicial) como aplicada sem rodar, e segue da V2 em diante
    # (a V2 cria o que faltar das tabelas e colunas da V1 num banco antigo).
    # Banco vazio: roda tudo desde a V1.
    baseline-on-migrate: true
    baseline-version: 1

  task:
    scheduling:
      pool:
        size: 4

booklit:
  # Endereco publico do front: base do link de convite (https://booklit.bio/convite/<codigo>).
  front-url: ${FRONT_URL:https://booklit.bio}
  admin:
    # E-mails (separados por virgula) autorizados a alterar/apagar temas globais.
    emails: ${BOOKLIT_ADMIN_EMAILS:}
  eventos:
    habilitado: ${BOOKLIT_EVENTOS_HABILITADO:false}
    topico-arn: ${BOOKLIT_EVENTOS_TOPICO_ARN:}
    fila-url: ${BOOKLIT_EVENTOS_FILA_URL:}
    consumidor:
      # Long polling do SQS (0 a 20 s): quanto o ReceiveMessage espera por mensagem antes de
      # voltar vazio. 20 é o mais barato; 0 volta ao polling curto.
      espera-segundos: ${BOOKLIT_EVENTOS_ESPERA_SEGUNDOS:20}
  aws:
    regiao: ${AWS_REGION:us-east-1}
    endpoint: ${BOOKLIT_AWS_ENDPOINT:}
  auth:
    login:
      # Login em duas etapas: senha e depois um codigo de 6 digitos enviado por e-mail.
      # So ligue com o envio de e-mail funcionando (SES fora do sandbox), senao ninguem entra.
      exigir-codigo: ${BOOKLIT_LOGIN_EXIGIR_CODIGO:false}
      # Limite de senhas erradas numa janela movel: estourou, 429 com Retry-After ate a falha
      # mais antiga sair da janela. E-mail + IP segura forca bruta numa conta sem trancar a
      # dona dela (que entra de outro IP); IP segura quem testa uma senha em muitas contas;
      # e-mail sozinho (alto) segura ataque distribuido. Ver ProtecaoDeLoginService.
      protecao:
        janela: ${BOOKLIT_LOGIN_JANELA:15m}
        max-falhas-por-email-e-ip: ${BOOKLIT_LOGIN_MAX_FALHAS_EMAIL_IP:5}
        max-falhas-por-ip: ${BOOKLIT_LOGIN_MAX_FALHAS_IP:30}
        max-falhas-por-email: ${BOOKLIT_LOGIN_MAX_FALHAS_EMAIL:50}
    otp:
      # Chave do HMAC dos codigos, base64 com 32+ bytes (openssl rand -base64 32).
      # Vazia = chave aleatoria por instancia (ok em dev; codigos morrem no restart).
      chave-hmac: ${BOOKLIT_OTP_CHAVE_HMAC:}
      validade: ${BOOKLIT_OTP_VALIDADE:10m}
      max-tentativas: ${BOOKLIT_OTP_MAX_TENTATIVAS:5}
      intervalo-reenvio: ${BOOKLIT_OTP_INTERVALO_REENVIO:60s}
      max-envios-por-hora: ${BOOKLIT_OTP_MAX_ENVIOS_POR_HORA:5}
    email:
      # Liga o envio pelo SES v2. Com booklit.aws.endpoint apontando para o Floci, os
      # e-mails ficam em GET <floci>/_aws/ses.
      habilitado: ${BOOKLIT_EMAIL_HABILITADO:false}
      remetente: ${BOOKLIT_EMAIL_REMETENTE:no-reply@booklit.bio}
      # Quem entrega: "ses" chama o SES direto; "client-go" manda para o servico Client_GO
      # (POST /notificacoes), que renderiza o template, envia pelo SES e guarda o historico.
      provedor: ${BOOKLIT_EMAIL_PROVEDOR:ses}
      client-go:
        url: ${BOOKLIT_CLIENT_GO_URL:http://localhost:8081}
        # Mesmo valor de um dos AVISO_TOKENS do Client_GO (32+ caracteres).
        token: ${BOOKLIT_CLIENT_GO_TOKEN:}
        timeout: ${BOOKLIT_CLIENT_GO_TIMEOUT:2s}
  fotos:
    # Bucket S3 privado das fotos de perfil. Vazio = fotos desligadas (endpoints respondem 503).
    bucket: ${BOOKLIT_FOTOS_BUCKET:}
    tamanho-maximo: ${BOOKLIT_FOTOS_TAMANHO_MAXIMO:2097152}
  convites:
    email:
      # Avisa por e-mail quem foi convidado para um clube (template convite-clube do Client_GO,
      # com o mesmo client-go.url/token acima). Desligado por padrao.
      habilitado: ${BOOKLIT_CONVITE_EMAIL_HABILITADO:false}
      # Endereco do site; o link do e-mail leva a <front-url>/clubes.
      front-url: ${FRONT_URL:https://booklit.bio}
  votacoes:
    lembrete:
      email:
        # "Lembrar quem nao votou" (template lembrete-votacao do Client_GO, mesmo client-go.url/token
        # e front-url do convite). Desligado, o lembrete e registrado mas nenhum e-mail sai.
        habilitado: ${BOOKLIT_LEMBRETE_VOTACAO_EMAIL_HABILITADO:false}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

app:
  url: ${APP_URL:}
  # Fuso de referencia do dominio - ver FusoHorarioConfig. Os campos LocalDateTime nao
  # carregam fuso, entao servidor e cliente precisam concordar em um so.
  timezone: ${APP_TIMEZONE:America/Sao_Paulo}

cors:
  # Dominios do front autorizados a chamar a API pelo navegador (separados por virgula).
  # Em producao: CORS_ALLOWED_ORIGINS=https://seu-front.up.railway.app
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

google:
  books:
    api-key: ${GOOGLE_BOOKS_API_KEY}
    url: https://www.googleapis.com/books/v1/volumes

agendamento:
  convite:
    expiracao:
      cron: "${CONVITE_EXPIRACAO_CRON:0 0 * * * *}"
  votacao:
    encerramento:
      cron: "${VOTACAO_ENCERRAMENTO_CRON:0 0 * * * *}"

logging:
  level:
    root: INFO
    github.jotagm.clube_livro: ${LOG_LEVEL_APP:INFO}
    # Suba para DEBUG quando precisar depurar autorizacao ou SQL.
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:INFO}
  pattern:
    # O [requestId] vem do MDC preenchido pelo RequestLoggingFilter e amarra
    # todas as linhas de uma mesma requisicao.
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p) %clr([%X{requestId:-________}]){faint} %clr(%-40.40logger{39}){cyan} %m%n%wEx"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
  default-produces-media-type: application/json
